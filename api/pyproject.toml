[project]
name = "astrocat"
version = "0.1.0"
description = "AstroCat API and astrology engine"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "libephemeris>=3.2.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
astrocat = "astrocat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated by Alembic.
extend-exclude = ["src/astrocat/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
